# Seiten, die der Apache selbst ausliefert (2026-11-03), siehe helpers/Wartung.js.
#
#   „Gleich zurück"  statt „Service Unavailable", wenn das Dashboard nicht antwortet
#   Wartung          unter /admin/wartung eingeschaltet: alle außer /admin sehen sie,
#                    auch wenn das Dashboard danach aus ist
#
# Einbinden im <VirtualHost *:443> von firenetworks.de, VOR "ProxyPass /":
#
#   Include /home/firedervil/dunebot_prod/apps/dashboard/wartung/apache.conf
#
# Danach: sudo apache2ctl configtest && sudo systemctl reload apache2

ProxyPass /_wartung/ !
Alias /_wartung/kit/ /home/firedervil/dunebot_prod/apps/dashboard/themes/default/assets/images/kit/
Alias /_wartung/ /home/firedervil/dunebot_prod/apps/dashboard/wartung/

<Directory /home/firedervil/dunebot_prod/apps/dashboard/wartung>
    Options None
    AllowOverride None
    Require all granted
    # Die Texte samt dem Namen, wer zuletzt geschaltet hat, und diese Datei selbst
    # gehen niemanden etwas an.
    <FilesMatch "^(stand\.json|apache\.conf)$|\.neu$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /home/firedervil/dunebot_prod/apps/dashboard/themes/default/assets/images/kit>
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Das Dashboard antwortet nicht, meist für die Sekunden eines Neustarts.
ErrorDocument 502 /_wartung/neustart.html
ErrorDocument 503 /_wartung/neustart.html

# Die Wartung ist an, solange das Dashboard die Seite dort abgelegt hat.
<If "-f '/home/firedervil/dunebot_prod/apps/dashboard/wartung/aktiv/wartung.html'">
    ErrorDocument 503 /_wartung/aktiv/wartung.html
</If>

# Durch kommen während der Wartung (Betreiber, 2026-11-03):
#   /admin, /auth          sonst lässt sich die Wartung nicht wieder ausschalten
#   /api/core/             was die Admin-Seiten nachladen (Meldungen)
#   Theme-Dateien          die Admin-Seiten brauchen ihr Aussehen
#   /api/<name>/webhook    Rückrufe von außen: Antwortet Twitch dort ein Fehler, kündigt
#                          es nach einer Weile die Abos aller Guilds
#   /downloads/            Updates der Daemons
#   /api/migration/        Umzüge: Die Daemons schieben die Sicherung hier durch, ein
#                          laufender Umzug bräche sonst ab
RewriteEngine On
RewriteCond /home/firedervil/dunebot_prod/apps/dashboard/wartung/aktiv/wartung.html -f
RewriteCond %{REQUEST_URI} !^/(admin|auth|_wartung|themes|public|vendor|assets|uploads|downloads|socket\.io)(/|$)
RewriteCond %{REQUEST_URI} !^/(favicon\.ico|robots\.txt)$
RewriteCond %{REQUEST_URI} !^/api/(core|migration)/
RewriteCond %{REQUEST_URI} !^/api/[^/]+/webhook
RewriteRule ^ - [R=503,L]

Header always set Retry-After "30" "expr=%{REQUEST_STATUS} == 503"
