# DuneBot Prod – Log-Rotation (Crontab, täglich 02:00)
#
# Jeder Prozess schreibt in eine Datei mit seinem Startdatum
# (bot-2026.9.16.log). Rotiert und gepackt wird täglich; gelöscht wird nach
# 30 Tagen von der Crontab-Zeile um 03:00 (find … -name '*.log-*' -mtime +30).
# `rotate 7` greift kaum: Nach einem Neustart wächst die alte Datei nicht mehr,
# sie kommt also nie auf sieben Rotationen.
#
# Kein `delaycompress`: Bei `copytruncate` schreibt der Prozess nie in die
# Kopie, das Aufschieben schützt nichts. Es ließ die letzte Rotation jeder
# Datei für immer ungepackt liegen — 692 MB am 2026-09-19 (Baustelle 141).

/home/firedervil/dunebot_prod/logs/*.log {
    daily
    rotate 7
    compress
    missingok
    notifempty
    copytruncate
    maxsize 50M
    dateext
    dateformat -%Y%m%d
}
