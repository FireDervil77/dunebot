# Auffang-Vhost — beantwortet alles, was zu keiner eingerichteten Domain gehört
#
# Apache gibt eine Anfrage, deren Host zu keinem Vhost passt, dem ERSTEN Vhost
# seiner Adresse. Das war bis 2026-10-14 dev.firenetworks.de: Ein Aufruf über
# die nackte IP (91.200.102.182, 45.138.51.242) oder über eine Domain, die noch
# hierher zeigt, landete beim Dev-Dashboard — gemessen 503, nur weil es gerade
# nicht lief. wepponapolis.eu zeigt im DNS weiter auf 45.138.51.242; ohne
# weppo.conf wäre es genau dort gelandet.
#
# Der Dateiname beginnt mit 000-, damit Apache diesen Vhost vor allen anderen
# lädt und er damit Standard für *:80 und *:443 wird. Echte Domains sind davon
# nicht betroffen — sie haben ihren eigenen Vhost mit ServerName.
#
# Das Zertifikat ist das von firenetworks.de. Es passt zu keinem fremden Namen;
# ein Browser warnt also, bevor er die 404 sieht. Das ist gewollt — es gibt
# hier nichts zu sehen.
#
# Installation:
#   sudo cp apache-000-auffang.conf /etc/apache2/sites-available/000-auffang.conf
#   sudo a2ensite 000-auffang
#   sudo apache2ctl -S 2>&1 | grep "default server"   # muss auffang.invalid nennen
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Danach darf weppo.conf raus:
#   sudo mv /etc/apache2/sites-enabled/weppo.conf /etc/apache2/sites-available/weppo.conf.stillgelegt-20261014
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName auffang.invalid

    RewriteEngine On
    RewriteRule ^ - [R=404,L]

    ErrorLog ${APACHE_LOG_DIR}/auffang-error.log
    CustomLog ${APACHE_LOG_DIR}/auffang-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName auffang.invalid

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/firenetworks.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/firenetworks.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    RewriteEngine On
    RewriteRule ^ - [R=404,L]

    ErrorLog ${APACHE_LOG_DIR}/auffang-error.log
    CustomLog ${APACHE_LOG_DIR}/auffang-access.log combined
</VirtualHost>
</IfModule>
