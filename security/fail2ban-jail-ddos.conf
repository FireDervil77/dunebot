# Fail2ban Jail für DDoS-Protection
# Bannt IPs, die zu viele NICHT-Asset-Requests in kurzer Zeit machen
# (Assets wie JS/CSS/Bilder werden vom Filter nicht mehr gezählt — siehe
#  fail2ban-filter-ddos.conf. Vorher wurden normale Dashboard-Nutzer gebannt,
#  weil eine einzige Seite Dutzende Asset-Requests auslöst.)
#
# Installation:
#   sudo cp fail2ban-jail-ddos.conf /etc/fail2ban/jail.d/dunebot-ddos.conf
#   sudo systemctl restart fail2ban
#
# Autor: FireBot Team
# Version: 2.1 (2026-07-28: Glob entfernt — siehe unten)

[dunebot-ddos]
enabled  = true
port     = http,https
filter   = dunebot-ddos
# NIEMALS /var/log/apache2/*access.log globben!
# Der Glob zog auch spacecluster_downloads_access.log mit ein. Über diesen
# VHost (downloads.firenetworks.de) lädt der Launcher den Spiel-Client —
# 216 Einzeldateien pro Installation. Die liefen in wenigen Sekunden gegen
# maxretry=150 und der Tester wurde mitten in der Installation gebannt.
# Hier NUR Logs von VHosts eintragen, die echten Seiten-Traffic liefern.
logpath  = /var/log/apache2/firenetworks_prod_access.log
          /var/log/apache2/firenetworks_dev_access.log
          /var/log/apache2/access.log
maxretry = 150
findtime = 60
bantime  = 3600
# NIEMALS bantime = -1: DSL-/Mobilfunk-IPs sind dynamisch — ein permanenter
# Ban trifft nach der Zwangstrennung den nächsten unschuldigen Kunden.
# Googlebot-Range + localhost nie bannen (Googlebot wurde 2026-07 beim
# normalen Crawlen als "DDoS" permanent gebannt → SEO-Schaden)
ignoreip = 127.0.0.1/8 ::1 66.249.64.0/19
# sendmail-whois entfernt (2026-07-28): /usr/sbin/sendmail ist auf diesem Host
# nicht installiert. Jeder Ban erzeugte dadurch einen 20-Zeilen-HINT-Block
# ("Command not found") in /var/log/fail2ban.log und machte es unlesbar.
action   = iptables-multiport[name=dunebot-ddos, port="http,https", protocol=tcp]

# Erklärung:
# maxretry = 150  → Ban bei > 150 gezählten Requests (Assets zählen nicht mit!)
# findtime = 60   → ... innerhalb von 60 Sekunden
# bantime  = 3600 → ... für 1 Stunde. Echte Dauerscanner triggern danach einfach erneut.
