# Fail2ban Filter für SpaceCluster (auth./downloads./api.firenetworks.de)
#
# Getrennt vom dunebot-ddos-Filter, weil das Lastprofil ein komplett anderes
# ist: Ein einziger legitimer Launcher-Start erzeugt ~150 Requests in 90 s
# (News, Health, Sektorliste, Login, Player-Load, Update-Check), ein
# Client-Download weitere 211 Einzeldateien. Am 27.07.2026 wurde ein Tester
# genau dadurch gebannt (dunebot-ddos, 150 failures) — der Download brach bei
# 15 % ab und er kam eine Stunde lang nicht mehr an den Server.
#
# Installation:
#   sudo cp fail2ban-filter-spacecluster.conf /etc/fail2ban/filter.d/spacecluster.conf
#   sudo cp fail2ban-jail-spacecluster.conf   /etc/fail2ban/jail.d/spacecluster.conf
#   sudo systemctl reload fail2ban
#
# Testen gegen echten Traffic (zeigt Treffer, ohne zu bannen):
#   sudo fail2ban-regex /var/log/apache2/spacecluster_downloads_access.log \
#        /etc/fail2ban/filter.d/spacecluster.conf --print-all-matched
#
# Autor: FireBot Team
# Version: 1.0 (2026-07-28)

[INCLUDES]
before = common.conf

[Definition]

# Gezählt wird NUR, was kein normaler Client-Betrieb ist. Zwei Filterstufen:
#
# 1. Pfad-/Endungs-Ausnahmen für die Auslieferung:
#    /client/, /client-alpha/, /client-beta/, /launcher/, /auth/, /health,
#    /sectors sowie alle Binär- und Asset-Endungen (der Client besteht aus
#    211 Dateien, 170 davon .dll).
#
# 2. Nur FEHLER-Statuscodes zählen (400/401/403/404/405/500).
#    Das ist der Schlüssel für /api/: Der Launcher fragt dort ständig legitim
#    an (/api/NewsApi, /api/player/load) und bekommt 200 — das zählt nicht.
#    Scanner-Sonden wie /api/v1/credentials oder /api/v1/apikey laufen ins
#    404 und werden gezählt. Ein pauschales /api/-Präfix als Ausnahme hätte
#    genau diese Sonden durchgelassen (im Test verifiziert).
#
# /auth/ bleibt Pfad-Ausnahme, weil /auth/validate im Normalbetrieb 401
# zurückgibt — sonst würde jeder abgelaufene Token als Angriff zählen.
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS) (?!/client/|/client-alpha/|/client-beta/|/launcher/|/auth/|/health|/sectors|/favicon\.ico|/robots\.txt)(?!\S*\.(?:dll|exe|resource|bundle|nupkg|zip|pak|dat|bin|assets|sig|json|so|dylib|js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)(?:\?|\s|"))\S* HTTP[^"]*" (?:400|401|403|404|405|500) .*$

# Suchmaschinen und Link-Previews nie zählen
ignoreregex = .*(Googlebot|GoogleOther|Google-InspectionTool|bingbot|Slackbot|facebookexternalhit|Discordbot|Applebot|DuckDuckBot|YandexBot).*

[Init]
maxretry = 40
findtime = 60
bantime = 1800
