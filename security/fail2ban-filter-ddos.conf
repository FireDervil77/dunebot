# Fail2ban Filter für DDoS-Attacken auf DuneBot
# Zählt Requests pro IP — ABER nur "echte" Seiten-/API-Requests.
#
# WICHTIG (Konsolidierung 2026-07): Statische Assets (JS, CSS, Bilder, Fonts)
# werden NICHT mehr gezählt. Vorher zählte jede Log-Zeile — eine einzige
# Dashboard-Seite löst aber Dutzende Asset-Requests aus, wodurch normale
# Nutzer (verifiziert: Vodafone-DSL-Anschlüsse) permanent gebannt wurden.
#
# Installation:
#   sudo cp fail2ban-filter-ddos.conf /etc/fail2ban/filter.d/dunebot-ddos.conf
#   sudo systemctl restart fail2ban
#
# Filter testen gegen echtes Log:
#   sudo fail2ban-regex /var/log/apache2/access.log /etc/fail2ban/filter.d/dunebot-ddos.conf
#
# Autor: FireBot Team
# Version: 2.0

[INCLUDES]
before = common.conf

[Definition]

# Zählt nur Requests, die NICHT auf statische Assets oder Download-Payloads gehen:
#  - Pfad-Präfixe /public/, /themes/, /uploads/, /downloads/, /client*/, /launcher/
#  - Datei-Endungen .js/.css/Bilder/Fonts/Sourcemaps
#  - Binär-Endungen der Client-/Launcher-Auslieferung (dll, exe, resource, ...)
#
# Warum die Binär-Endungen (2026-07-28): Eine Client-Installation lädt 216
# Einzeldateien (170 davon .dll). Ohne diese Ausnahme erreicht ein Tester
# maxretry=150 lange bevor die Installation durch ist und wird gebannt.
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS) (?!/public/|/themes/|/uploads/|/downloads/|/client/|/client-alpha/|/client-beta/|/launcher/|/favicon\.ico|/robots\.txt)(?!\S*\.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|otf|map|dll|exe|resource|bundle|nupkg|zip|pak|dat|bin|assets|sig|so|dylib)(?:\?|\s|"))\S* HTTP[^"]*" (?:200|301|302|304|400|401|403|404|405|500) .*$

# Legitime Bots/Crawler nie zählen (Discordbot: Link-Previews im Discord-Client!)
ignoreregex = .*(Googlebot|GoogleOther|Google-InspectionTool|bingbot|Slackbot|facebookexternalhit|Discordbot|Applebot|DuckDuckBot|YandexBot).*

[Init]
maxretry = 150
findtime = 60
bantime = 3600
