# VirtualHost für wepponapolis.eu — stillgelegt
#
# Die Seite gehörte zu einem früheren Vorhaben (Express auf 5000, Vite auf
# 3000). Beide Ports sind inzwischen anders belegt: auf 5000 sitzt die
# Docker-Registry, auf 3000 das Produktiv-Dashboard. Die alte Fassung reichte
# deshalb das Dashboard unter einer zweiten Domain durch, zeigte mit /api auf
# die Registry und nahm /phpmyadmin vom Proxy aus — phpMyAdmin stand damit
# ohne den Vorschaltschutz von db.firenetworks.de im Netz (gemessen 2026-10-13).
#
# Jetzt antwortet die Domain auf alles mit 404. Das Zertifikat bleibt, damit
# der Aufruf sauber endet statt auf der ersten Seite der Liste zu landen.
#
# Installation:
#   sudo cp /etc/apache2/sites-enabled/weppo.conf /etc/apache2/sites-available/weppo.conf.bak-20261013
#   sudo cp apache-weppo.conf /etc/apache2/sites-enabled/weppo.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Dazu gehört, den allgemeinen Alias abzuschalten — er liefert phpMyAdmin auf
# jeder Seite aus, die nicht alles an einen Proxy gibt (auch auf
# downloads.firenetworks.de):
#   sudo sed -i.bak-20261013 's|^Alias /phpmyadmin |#&|' /etc/phpmyadmin/apache.conf
# Der Zugang über db.firenetworks.de hat seinen eigenen Alias und bleibt.

<VirtualHost *:80>
    ServerName wepponapolis.eu

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wepponapolis.eu

    # SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wepponapolis.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wepponapolis.eu/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security Headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin

    # Nichts wird ausgeliefert und nichts weitergereicht.
    RewriteEngine On
    RewriteRule ^ - [R=404,L]

    ErrorLog ${APACHE_LOG_DIR}/wepponapolis-error.log
    CustomLog ${APACHE_LOG_DIR}/wepponapolis-access.log combined
</VirtualHost>
</IfModule>
