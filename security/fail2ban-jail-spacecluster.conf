# Fail2ban Jail für SpaceCluster
#
# Deckt die VHosts auth./chat./api./admin./downloads.firenetworks.de ab.
# Der dunebot-ddos-Jail überwacht diese Logs bewusst NICHT mehr (v2.1) —
# seine Schwellen sind für Dashboard-Seitenaufrufe gedacht und ein normaler
# Launcher-Start hat sie gesprengt.
#
# Installation:
#   sudo cp fail2ban-filter-spacecluster.conf /etc/fail2ban/filter.d/spacecluster.conf
#   sudo cp fail2ban-jail-spacecluster.conf   /etc/fail2ban/jail.d/spacecluster.conf
#   sudo systemctl reload fail2ban
#
# Danach prüfen:
#   sudo fail2ban-client status spacecluster
#
# Autor: FireBot Team
# Version: 1.0 (2026-07-28)

[spacecluster]
enabled  = true
port     = http,https
filter   = spacecluster
logpath  = /var/log/apache2/spacecluster_auth_access.log
           /var/log/apache2/spacecluster_downloads_access.log
           /var/log/apache2/spacecluster_api_access.log
           /var/log/apache2/spacecluster_chat_access.log
           /var/log/apache2/spacecluster_admin_access.log

# 40 NICHT-Client-Requests in 60 s. Der Filter zählt regulären Spiel- und
# Launcher-Verkehr gar nicht erst mit, deshalb reicht hier eine niedrige
# Schwelle: Wer 40-mal pro Minute Pfade abklopft, die weder Client noch
# Launcher je anfragen, ist ein Scanner.
maxretry = 40
findtime = 60

# 30 Minuten. NIEMALS bantime = -1 — Endkunden-IPs sind dynamisch, ein
# permanenter Ban trifft nach der Zwangstrennung den nächsten Kunden.
bantime  = 1800

# Eigener Server, Admin-Anschlüsse und Googlebot-Range nie bannen.
# WICHTIG: Diese Zeile überschreibt das ignoreip aus jail.local — die dort
# gelisteten Adressen müssen hier mit aufgeführt sein.
ignoreip = 127.0.0.1/8 ::1 45.138.51.242 91.200.102.182 94.31.110.0/24 188.98.10.88 66.249.64.0/19

# Kein sendmail: /usr/sbin/sendmail ist auf diesem Host nicht installiert und
# erzeugt sonst pro Ban einen 20-Zeilen-Fehlerblock im fail2ban-Log.
action   = iptables-multiport[name=spacecluster, port="http,https", protocol=tcp]

# ── Hinweis zu den Spiel-Ports ────────────────────────────────────────────
# Master (7700/7701) und Chat (7900) lauschen direkt auf 0.0.0.0 und laufen
# NICHT über Apache. Ein Ban hier sperrt also nur HTTP/HTTPS — ein gebannter
# Spieler kann sich weiterhin einloggen, aber keine Dateien mehr laden.
# Genau dieses Bild ("Zugang ja, Installation nein") hatten die Tester am
# 27.07.2026. Bei entsprechenden Meldungen zuerst hier nachsehen:
#   sudo "$(which node)" security/manage-blocked-ips.js status <ip>
